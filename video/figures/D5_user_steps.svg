<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <polygon points="0,0 14,7 0,14" fill="#7fdb7f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#0a0a14"/>

  <text x="960" y="100" font-size="56" font-weight="600" fill="#ffffff" text-anchor="middle">D5  What you do as a user</text>
  <text x="960" y="150" font-size="28" fill="#a0a0c0" text-anchor="middle">Four steps. The LLM does the rest.</text>

  <!-- Step 1 -->
  <g>
    <circle cx="160" cy="290" r="50" fill="#1a3a1a" stroke="#7fdb7f" stroke-width="3"/>
    <text x="160" y="305" font-size="44" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>

    <rect x="240" y="240" width="1560" height="100" fill="#1a1a28" stroke="#4a5568" stroke-width="2" rx="12"/>
    <text x="270" y="285" font-size="30" font-weight="600" fill="#7fdb7f">Clone</text>
    <text x="270" y="320" font-size="22" fill="#a0a0c0" font-family="Consolas,monospace">git clone https://github.com/ysk424/houdini-apex-handbuild.git</text>
  </g>

  <!-- Arrow -->
  <line x1="160" y1="350" x2="160" y2="430" stroke="#7fdb7f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g>
    <circle cx="160" cy="500" r="50" fill="#1a3a1a" stroke="#7fdb7f" stroke-width="3"/>
    <text x="160" y="515" font-size="44" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>

    <rect x="240" y="450" width="1560" height="100" fill="#1a1a28" stroke="#4a5568" stroke-width="2" rx="12"/>
    <text x="270" y="495" font-size="30" font-weight="600" fill="#7fdb7f">Install MCP</text>
    <text x="270" y="530" font-size="22" fill="#a0a0c0">Read docs/01_mcp_setup.md - install houdini-mcp, apply 4-bug-fix patch, restart Houdini</text>
  </g>

  <line x1="160" y1="560" x2="160" y2="640" stroke="#7fdb7f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g>
    <circle cx="160" cy="710" r="50" fill="#1a3a1a" stroke="#7fdb7f" stroke-width="3"/>
    <text x="160" y="725" font-size="44" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>

    <rect x="240" y="660" width="1560" height="100" fill="#1a1a28" stroke="#4a5568" stroke-width="2" rx="12"/>
    <text x="270" y="705" font-size="30" font-weight="600" fill="#7fdb7f">Verify</text>
    <text x="270" y="740" font-size="22" fill="#a0a0c0" font-family="Consolas,monospace">python scripts/verify_setup.py    # expect ALL GREEN</text>
  </g>

  <line x1="160" y1="770" x2="160" y2="850" stroke="#7fdb7f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g>
    <circle cx="160" cy="920" r="50" fill="#1a3a1a" stroke="#7fdb7f" stroke-width="3"/>
    <text x="160" y="935" font-size="44" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>

    <rect x="240" y="870" width="1560" height="120" fill="#1a2540" stroke="#6ec1ff" stroke-width="2" rx="12"/>
    <text x="270" y="915" font-size="30" font-weight="600" fill="#6ec1ff">Run prompts</text>
    <text x="270" y="950" font-size="22" fill="#a0a0c0">Open your code-LLM. Paste each prompts/*.md file in order, starting with 01_setup.md.</text>
    <text x="270" y="978" font-size="22" fill="#a0a0c0">The LLM reads, decides, calls Houdini through MCP. You watch.</text>
  </g>

  <text x="960" y="1050" font-size="22" fill="#a0a0c0" text-anchor="middle">Bring your own FBX character + FBX animation. Repo ships no assets (license).</text>
</svg>
