<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter','Helvetica Neue',sans-serif">
  <rect width="1920" height="1080" fill="#0a0a14"/>

  <text x="960" y="100" font-size="56" font-weight="600" fill="#ffffff" text-anchor="middle">D4-b  Repository structure</text>
  <text x="960" y="150" font-size="28" fill="#a0a0c0" text-anchor="middle">github.com/ysk424/houdini-apex-handbuild</text>

  <!-- Tree -->
  <g font-family="Consolas,monospace" font-size="26">
    <text x="200" y="240" fill="#6ec1ff">houdini-apex-handbuild/</text>
    <text x="240" y="290" fill="#e8e8f0">|-- README.md</text>
    <text x="240" y="335" fill="#a0a0c0">|-- .gitignore</text>
    <text x="240" y="380" fill="#a0a0c0">|-- LICENSE</text>
    <text x="240" y="425" fill="#a0a0c0">|-- LICENSE-docs</text>
    <text x="240" y="475" fill="#7fdb7f">|-- docs/</text>
    <text x="280" y="510" fill="#e8e8f0">|-- 01_mcp_setup.md</text>
    <text x="280" y="540" fill="#a0a0c0">|-- ... (procedure phases)</text>
    <text x="280" y="570" fill="#a0a0c0">|-- 99_open_questions.md</text>
    <text x="240" y="620" fill="#7fdb7f">|-- prompts/</text>
    <text x="280" y="655" fill="#e8e8f0">|-- 01_setup.md</text>
    <text x="280" y="685" fill="#a0a0c0">|-- ... (LLM-runnable prompts)</text>
    <text x="240" y="735" fill="#7fdb7f">|-- scripts/</text>
    <text x="280" y="770" fill="#e8e8f0">|-- verify_setup.py</text>
    <text x="240" y="820" fill="#7fdb7f">|-- aaaa-snapshot/</text>
    <text x="280" y="855" fill="#a0a0c0">|-- ... (frozen AAAA tag tool)</text>
    <text x="240" y="905" fill="#7fdb7f">'-- video/</text>
    <text x="280" y="940" fill="#a0a0c0">'-- figures/   (1920x1080 SVGs)</text>
  </g>

  <!-- Right: legend -->
  <g>
    <rect x="1100" y="240" width="700" height="700" fill="#1a1a28" stroke="#4a5568" stroke-width="2" rx="14"/>
    <text x="1450" y="285" font-size="32" font-weight="600" fill="#6ec1ff" text-anchor="middle">What goes where</text>

    <g font-size="22">
      <text x="1130" y="350" fill="#7fdb7f" font-weight="600">docs/</text>
      <text x="1130" y="385" fill="#e8e8f0">Read this first.</text>
      <text x="1130" y="415" fill="#a0a0c0">Procedure phases, one per file.</text>

      <text x="1130" y="475" fill="#7fdb7f" font-weight="600">prompts/</text>
      <text x="1130" y="510" fill="#e8e8f0">Copy-paste into your LLM.</text>
      <text x="1130" y="540" fill="#a0a0c0">Each is executable as-is, idempotent.</text>

      <text x="1130" y="600" fill="#7fdb7f" font-weight="600">scripts/</text>
      <text x="1130" y="635" fill="#e8e8f0">Pure Python helpers.</text>
      <text x="1130" y="665" fill="#a0a0c0">verify_setup.py is the entry point.</text>

      <text x="1130" y="725" fill="#7fdb7f" font-weight="600">aaaa-snapshot/</text>
      <text x="1130" y="760" fill="#e8e8f0">The tag-author tool, frozen copy.</text>
      <text x="1130" y="790" fill="#a0a0c0">Imported by the LLM during the procedure.</text>

      <text x="1130" y="850" fill="#7fdb7f" font-weight="600">video/figures/</text>
      <text x="1130" y="885" fill="#e8e8f0">These diagrams (open in browser).</text>
      <text x="1130" y="915" fill="#a0a0c0">SVG, screenshot for your own slides if you want.</text>
    </g>
  </g>

  <text x="960" y="1010" font-size="22" fill="#6ec1ff" text-anchor="middle">Clone, run verify_setup.py, then start with docs/01_mcp_setup.md.</text>
</svg>
