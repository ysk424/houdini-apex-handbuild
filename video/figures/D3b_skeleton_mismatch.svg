<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <polygon points="0,0 14,7 0,14" fill="#c060ff"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#0a0a14"/>

  <text x="960" y="100" font-size="56" font-weight="600" fill="#ffffff" text-anchor="middle">D3-b  Skeleton mismatch and the 8-pair remap</text>
  <text x="960" y="150" font-size="28" fill="#a0a0c0" text-anchor="middle">Canonical CC4 (Cascadeur output) -&gt; low-poly CC4 (our character)</text>

  <!-- Left: canonical CC4 hierarchy fragment -->
  <g>
    <rect x="80" y="220" width="560" height="640" fill="#1a1a28" stroke="#4a5568" stroke-width="2" rx="14"/>
    <text x="360" y="270" font-size="28" font-weight="600" fill="#c060ff" text-anchor="middle">Canonical CC4 (anim, 101 joints)</text>

    <g font-family="Consolas,monospace" font-size="22">
      <text x="120" y="330" fill="#e8e8f0">CC_Base_L_Clavicle</text>
      <text x="160" y="370" fill="#e8e8f0">|--&gt; CC_Base_L_Upperarm</text>
      <text x="220" y="410" fill="#ff6060">     |--&gt; CC_Base_L_UpperarmTwist01  (DELETED)</text>
      <text x="220" y="440" fill="#a0a0c0">     |--&gt; CC_Base_L_UpperarmTwist02</text>
      <text x="220" y="470" fill="#e8e8f0">     |--&gt; CC_Base_L_Forearm</text>
      <text x="290" y="500" fill="#ff6060">          |--&gt; CC_Base_L_ForearmTwist01  (DELETED)</text>
      <text x="290" y="530" fill="#a0a0c0">          |--&gt; CC_Base_L_ForearmTwist02</text>
      <text x="290" y="560" fill="#e8e8f0">          |--&gt; CC_Base_L_Hand</text>
    </g>

    <text x="360" y="640" font-size="22" fill="#a0a0c0" text-anchor="middle">Pelvis -&gt; Thigh -&gt; Calf -&gt; Foot pattern</text>
    <text x="360" y="675" font-size="22" fill="#a0a0c0" text-anchor="middle">repeats for legs, with the same Twist01 children.</text>

    <text x="360" y="740" font-size="22" fill="#ffd560" text-anchor="middle">8 conflicting Twist01 joints get DELETED.</text>
    <text x="360" y="775" font-size="22" fill="#ffd560" text-anchor="middle">Their child Twist02 reparents to the canonical primary.</text>

    <text x="360" y="830" font-size="20" fill="#a0a0c0" text-anchor="middle">Then 8 canonical primaries get renamed -&gt;</text>
  </g>

  <!-- Center: arrow -->
  <line x1="660" y1="540" x2="780" y2="540" stroke="#c060ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="720" y="510" font-size="24" fill="#c060ff" text-anchor="middle">remap</text>

  <!-- Right: low-poly hierarchy -->
  <g>
    <rect x="800" y="220" width="560" height="640" fill="#1a1a28" stroke="#4a5568" stroke-width="2" rx="14"/>
    <text x="1080" y="270" font-size="28" font-weight="600" fill="#7fdb7f" text-anchor="middle">Low-poly CC4 (our char, 80 joints)</text>

    <g font-family="Consolas,monospace" font-size="22">
      <text x="840" y="330" fill="#e8e8f0">CC_Base_L_Clavicle</text>
      <text x="880" y="370" fill="#7fdb7f">|--&gt; CC_Base_L_UpperarmTwist01</text>
      <text x="940" y="410" fill="#a0a0c0">     |--&gt; CC_Base_L_UpperarmTwist02</text>
      <text x="940" y="440" fill="#7fdb7f">     |--&gt; CC_Base_L_ForearmTwist01</text>
      <text x="1000" y="480" fill="#a0a0c0">          |--&gt; CC_Base_L_ForearmTwist02</text>
      <text x="1000" y="510" fill="#e8e8f0">          |--&gt; CC_Base_L_Hand</text>
    </g>

    <text x="1080" y="600" font-size="22" fill="#a0a0c0" text-anchor="middle">No canonical primaries: Twist01 IS the primary.</text>

    <text x="1080" y="690" font-size="22" fill="#7fdb7f" text-anchor="middle">After remap, the animation joint names</text>
    <text x="1080" y="720" font-size="22" fill="#7fdb7f" text-anchor="middle">match this hierarchy 80 / 80.</text>

    <text x="1080" y="800" font-size="20" fill="#a0a0c0" text-anchor="middle">Bone deform binds by name + path.</text>
    <text x="1080" y="830" font-size="20" fill="#a0a0c0" text-anchor="middle">All 80 joints inherit per-frame transforms.</text>
  </g>

  <!-- Bottom rename table -->
  <g>
    <rect x="1380" y="220" width="460" height="640" fill="#1a1a28" stroke="#6ec1ff" stroke-width="2" rx="14"/>
    <text x="1610" y="270" font-size="28" font-weight="600" fill="#6ec1ff" text-anchor="middle">8 rename pairs</text>

    <g font-family="Consolas,monospace" font-size="20">
      <text x="1410" y="330" fill="#e8e8f0">L_Upperarm  -&gt;  L_UpperarmTwist01</text>
      <text x="1410" y="370" fill="#e8e8f0">R_Upperarm  -&gt;  R_UpperarmTwist01</text>
      <text x="1410" y="410" fill="#e8e8f0">L_Forearm   -&gt;  L_ForearmTwist01</text>
      <text x="1410" y="450" fill="#e8e8f0">R_Forearm   -&gt;  R_ForearmTwist01</text>
      <text x="1410" y="490" fill="#e8e8f0">L_Thigh     -&gt;  L_ThighTwist01</text>
      <text x="1410" y="530" fill="#e8e8f0">R_Thigh     -&gt;  R_ThighTwist01</text>
      <text x="1410" y="570" fill="#e8e8f0">L_Calf      -&gt;  L_CalfTwist01</text>
      <text x="1410" y="610" fill="#e8e8f0">R_Calf      -&gt;  R_CalfTwist01</text>
    </g>

    <text x="1610" y="690" font-size="22" fill="#a0a0c0" text-anchor="middle">Each joint with name in left column</text>
    <text x="1610" y="720" font-size="22" fill="#a0a0c0" text-anchor="middle">becomes the right column joint.</text>

    <text x="1610" y="800" font-size="20" fill="#ffd560" text-anchor="middle">CC_Base_Hip exists in anim only -</text>
    <text x="1610" y="830" font-size="20" fill="#ffd560" text-anchor="middle">left as no-op (root motion is on Pelvis).</text>
  </g>

  <text x="960" y="950" font-size="22" fill="#a0a0c0" text-anchor="middle">If your character is canonical CC4 and your animation is canonical CC4 (no low-poly variant): skip this whole pipeline,</text>
  <text x="960" y="980" font-size="22" fill="#a0a0c0" text-anchor="middle">feed the FBX animation directly into bonedeform.</text>
  <text x="960" y="1030" font-size="20" fill="#6ec1ff" text-anchor="middle">If you have a different bone-naming convention (Mixamo, custom) - rewrite this remap with your equivalents.</text>
</svg>
