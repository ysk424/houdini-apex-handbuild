<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter','Helvetica Neue',sans-serif">
  <rect width="1920" height="1080" fill="#0a0a14"/>

  <text x="960" y="100" font-size="56" font-weight="600" fill="#ffffff" text-anchor="middle">D6  Status of the procedure</text>
  <text x="960" y="150" font-size="28" fill="#a0a0c0" text-anchor="middle">What's solved, what's worked around, what's open</text>

  <!-- Solved -->
  <g>
    <rect x="80" y="220" width="1760" height="220" fill="#1a3a1a" stroke="#7fdb7f" stroke-width="3" rx="14"/>
    <circle cx="140" cy="270" r="30" fill="#7fdb7f"/>
    <text x="140" y="282" font-size="36" font-weight="600" fill="#0a0a14" text-anchor="middle">+</text>
    <text x="200" y="280" font-size="36" font-weight="600" fill="#7fdb7f">Solved</text>

    <text x="100" y="340" font-size="24" fill="#e8e8f0">- AAAA tag system - chain tags + IK role tags from external JSON, idempotent, byte-stable</text>
    <text x="100" y="378" font-size="24" fill="#e8e8f0">- multiik segments setup via parameters3 spare parm (the "manual surface" trick)</text>
    <text x="100" y="416" font-size="24" fill="#e8e8f0">- Walking animation - Cascadeur 24fps walk, kinefx classic bonedeform, 80/80 joint match</text>
  </g>

  <!-- Worked around -->
  <g>
    <rect x="80" y="470" width="1760" height="180" fill="#3a3010" stroke="#ffd560" stroke-width="3" rx="14"/>
    <circle cx="140" cy="520" r="30" fill="#ffd560"/>
    <text x="140" y="534" font-size="40" font-weight="600" fill="#0a0a14" text-anchor="middle">!</text>
    <text x="200" y="530" font-size="36" font-weight="600" fill="#ffd560">Worked around</text>

    <text x="100" y="590" font-size="24" fill="#e8e8f0">- kinefx::rigattribwrangle silently drops s@path writes - workaround: use plain attribwrangle</text>
    <text x="100" y="628" font-size="24" fill="#e8e8f0">- Houdini-MCP tools had 4 bugs (Parm.label / Color / vexSyntaxCheck) - PR #3 filed upstream</text>
  </g>

  <!-- Open -->
  <g>
    <rect x="80" y="680" width="1760" height="240" fill="#3a1a1a" stroke="#ff6060" stroke-width="3" rx="14"/>
    <circle cx="140" cy="730" r="30" fill="#ff6060"/>
    <text x="140" y="744" font-size="36" font-weight="600" fill="#0a0a14" text-anchor="middle">x</text>
    <text x="200" y="740" font-size="36" font-weight="600" fill="#ff6060">Open - PRs welcome</text>

    <text x="100" y="800" font-size="24" fill="#e8e8f0">- APEX scene compile from autorigcomponent stays "abstract" (1 node, 1 port)</text>
    <text x="100" y="835" font-size="22" fill="#a0a0c0">  apex::sceneanimate / sceneinvoke return 0 points. apex::buildfkgraph and similar untested.</text>

    <text x="100" y="880" font-size="24" fill="#e8e8f0">- IK actually firing during animation playback (depends on the above)</text>
    <text x="100" y="912" font-size="22" fill="#a0a0c0">  multiik tags + segments are correct - the rig that would consume them isn't compiled yet.</text>
  </g>

  <text x="960" y="1010" font-size="22" fill="#a0a0c0" text-anchor="middle">If you solve any "open" item, please open a PR or an issue. Five-month investigation log linked in README.</text>
  <text x="960" y="1045" font-size="22" fill="#6ec1ff" text-anchor="middle">github.com/ysk424/houdini-apex-handbuild/issues</text>
</svg>
